<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Contabills Gestão · teste</title>
<link rel="manifest" href="manifest-painel.webmanifest">
<meta name="theme-color" content="#123F34">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<script>/* instalação */if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:var(--ground);color:var(--ink);overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{--ground:#F6F5F2;--card:#FFFFFF;--line:#E7E5DF;--ink:#17181B;--muted:#6B6F76;--muted2:#9A9DA3;--dot:#C9C7C0;--onA:#FFFFFF;
 --warn:#9A5B00;--warnBg:#FFF1D6;--info:#2D5BA8;--infoBg:#E3ECFA;--okc:#1E7A52;--okBg:#E1F2E9;--bad:#B3261E;--badBg:#FCE4E1;
 --a1:#3FA182;--a2:#1E5E4E;--a3:#123F34;--accent:#1E5E4E;--tint:#E3EFEA;--g1:#D5EBE2;--g2:#E8F2EE;--glow:rgba(30,94,78,.3);
 min-height:100vh;background:var(--ground);color:var(--ink);display:flex}
.app[data-tema="rosa"]{--a1:#FF7396;--a2:#FF3F6C;--a3:#D41F4D;--accent:#D9295A;--tint:#FFE4EB;--g1:#FFD9E3;--g2:#FFEDF2;--glow:rgba(255,63,108,.32)}
.app[data-tema="azul"]{--a1:#3D63C9;--a2:#1D3E8F;--a3:#0F2459;--accent:#1D3E8F;--tint:#E1E8F7;--g1:#D6DFF2;--g2:#E8EDF7;--glow:rgba(29,62,143,.3)}
.app[data-tema="roxo"]{--a1:#9B5DE5;--a2:#6A2CBF;--a3:#47188A;--accent:#6A2CBF;--tint:#EEE5FA;--g1:#E3D6F7;--g2:#F0EAFA;--glow:rgba(106,44,191,.3)}
.app[data-escuro="1"]{--ground:#121416;--card:#1C1F22;--line:#2C3034;--ink:#EEF0F2;--muted:#9AA0A7;--muted2:#6F757C;--dot:#43484E;
 --g1:color-mix(in srgb,var(--a2) 38%,#121416);--g2:color-mix(in srgb,var(--a2) 14%,#121416);--tint:color-mix(in srgb,var(--a1) 20%,#1C1F22);
 --accent:color-mix(in srgb,var(--a1) 78%,#fff);--glow:rgba(0,0,0,.45);--warn:#F2C26B;--warnBg:#3A2E17;--info:#8DB3F5;--infoBg:#1D2A40;--okc:#7FD9A9;--okBg:#16302A;--bad:#FF8A80;--badBg:#3A1D1B}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.s{width:16px;height:16px}

/* barra lateral (web) */
.side{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--g1) 0,var(--g2) 180px,var(--ground) 420px)}
.top{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 16px 10px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--g1) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.top .tt{flex:1;min-width:0}
.top .kick{font-size:12px;color:var(--muted);font-weight:600}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb{width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.06);position:relative;flex:none;color:var(--ink)}
.rb .pip{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--card)}
.srch{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:44px;color:var(--muted)}
.srch input{flex:1;border:0;outline:0;background:none;min-width:0;height:100%;color:var(--ink)}
.view{padding:6px 16px calc(100px + env(safe-area-inset-bottom));max-width:1240px;width:100%;margin:0 auto}
.mob-srch{margin:4px 0 14px}

/* menu inferior (celular) */
.bnav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;background:var(--card);border:1px solid var(--line);border-radius:22px;display:flex;padding:6px;box-shadow:0 10px 30px var(--glow)}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:16px;font-size:11px;font-weight:600;color:var(--muted)}
.bnav button.on{color:var(--accent);background:var(--tint)}

/* blocos */
.sec{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:22px 2px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec a,.lnk{color:var(--accent);text-transform:none;letter-spacing:0;font-size:13px;font-weight:700;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
.kpi .d{font-size:12px;font-weight:600;margin-top:2px;color:var(--muted)}
.up{color:var(--okc)!important}.dn{color:var(--bad)!important}
.hero{background:linear-gradient(135deg,var(--a1),var(--a2) 55%,var(--a3));color:var(--onA);border:0;border-radius:24px;padding:18px;box-shadow:0 14px 34px var(--glow);position:relative;overflow:hidden}
.hero .l{opacity:.85;font-size:13px;font-weight:600}
.hero .v{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.hero .row{display:flex;gap:18px;margin-top:12px;flex-wrap:wrap;font-size:12px;opacity:.95}
.hero .row b{display:block;font-size:16px}
.hero svg.bg{position:absolute;right:-30px;top:-30px;width:180px;height:180px;opacity:.12;stroke:#fff}

.list{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.it{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;min-width:0}
.it:first-child{border-top:0}
.it:hover{background:color-mix(in srgb,var(--tint) 45%,transparent)}
.av{width:40px;height:40px;border-radius:14px;background:var(--tint);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.av.r{border-radius:50%}
.it .tx{flex:1;min-width:0}
.it .t{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.it .cols{display:none}
.it .end{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.it .end small{font-size:12px;color:var(--muted)}
.thead{display:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--tint);color:var(--accent)}
.chip.ok{background:var(--okBg);color:var(--okc)}.chip.wa{background:var(--warnBg);color:var(--warn)}.chip.ba{background:var(--badBg);color:var(--bad)}.chip.in{background:var(--infoBg);color:var(--info)}.chip.mu{background:color-mix(in srgb,var(--line) 70%,transparent);color:var(--muted)}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor}

.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fb{flex:none;height:36px;padding:0 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.fb.on{background:var(--accent);border-color:var(--accent);color:var(--onA)}
.app[data-escuro="1"] .fb.on{color:#10201B}
.btn{height:46px;padding:0 18px;border-radius:999px;background:linear-gradient(135deg,var(--a1),var(--a2) 60%,var(--a3));color:var(--onA);font-weight:800;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 20px var(--glow)}
.btn.gh{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.dg{background:var(--badBg);color:var(--bad);box-shadow:none}
.btn.sm{height:38px;padding:0 14px;font-size:13px}
.btn.bl{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px;flex-wrap:wrap}
.toolbar .cnt{font-size:13px;color:var(--muted);font-weight:600}

.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bars .b i{display:block;width:100%;max-width:38px;border-radius:10px 10px 4px 4px;background:var(--g1)}
.bars .b.cur i{background:linear-gradient(180deg,var(--a1),var(--a2))}
.bars .b span{font-size:11px;color:var(--muted);font-weight:600}
.bars .b em{font-style:normal;font-size:11px;font-weight:700;color:var(--ink)}
.meter{height:10px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--a1),var(--a2))}
.meter i.wa{background:var(--warn)}.meter i.ba{background:var(--bad)}
.leg{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--muted);font-weight:600}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.prz{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.prz .p{border-radius:16px;padding:12px;background:var(--g2)}
.prz .p b{display:block;font-size:22px;font-weight:800}
.prz .p span{font-size:12px;color:var(--muted);font-weight:600}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--infoBg);color:var(--info);border-radius:16px;padding:12px 14px;font-size:13px;font-weight:600;line-height:1.45}
.note.wa{background:var(--warnBg);color:var(--warn)}
.row2{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.row2>*{min-width:0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}
.kv span{color:var(--muted)}
.kv b{text-align:right;font-weight:700}
.plan{border:1px solid var(--line);border-radius:20px;padding:16px;background:var(--card);display:flex;flex-direction:column;gap:6px}
.plan.hi{border:2px solid var(--accent)}
.plan .pn{font-weight:800;font-size:17px}
.plan .pp{font-size:26px;font-weight:800;letter-spacing:-.02em}
.plan .pp small{font-size:13px;color:var(--muted);font-weight:600}
.plan ul{list-style:none;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:5px;margin-top:6px}
.plan li{display:flex;gap:6px;align-items:center}
.plan li svg{color:var(--okc)}
.tg{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.tg:first-child{border-top:0}
.tg .tx{flex:1;min-width:0}
.tg .t{font-weight:700;font-size:14.5px}
.tg .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.sw{width:46px;height:28px;border-radius:99px;background:var(--dot);position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--accent)}
.sw.on::after{left:21px}
.sel{height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 10px;font-weight:600;font-size:14px;max-width:100%}
.inp{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:15px;outline:0}
.inp:focus,.sel:focus{border-color:var(--accent)}
textarea.inp{height:90px;padding:12px 14px;resize:none}
label.fl{display:block;font-weight:700;font-size:14px;margin:14px 0 7px}
.sws{display:flex;gap:10px;flex-wrap:wrap}
.swt{width:42px;height:42px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.swt.on{box-shadow:0 0 0 2px var(--accent)}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
.msg{max-width:82%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.4;margin:6px 0}
.msg.in{background:var(--g2);border-bottom-left-radius:6px}
.msg.out{background:var(--accent);color:var(--onA);margin-left:auto;border-bottom-right-radius:6px}
.app[data-escuro="1"] .msg.out{color:#10201B}
.msg small{display:block;font-size:11px;opacity:.7;margin-top:3px}

/* folha / gaveta */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:50;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--ground);border-radius:26px 26px 0 0;max-height:90vh;overflow-y:auto;overflow-x:hidden;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding:10px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--dot);margin:0 auto 12px}
.sh-h{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sh-h .tx{flex:1;min-width:0}
.sh-h h2{font-size:20px;font-weight:800;letter-spacing:-.01em}
.sh-h p{font-size:13px;color:var(--muted)}
.menu-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.menu-grid button{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;font-weight:700}
.menu-grid button .av{width:44px;height:44px}
.menu-grid button.on{border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--ground);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:700;z-index:90;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hide-m{display:none}

/* web */
@media (min-width:900px){
 .side{display:flex;flex-direction:column;width:256px;flex:none;position:sticky;top:0;height:100vh;background:var(--card);border-right:1px solid var(--line);padding:18px 14px;gap:4px;overflow-y:auto}
 .logo{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
 .logo .mk{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--a1),var(--a3));display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px var(--glow)}
 .logo b{font-size:17px;font-weight:800;letter-spacing:-.02em;display:block}
 .logo small{font-size:12px;color:var(--muted);font-weight:600}
 .side .nv{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;font-weight:700;font-size:14px;color:var(--muted);text-align:left;width:100%}
 .side .nv:hover{background:var(--g2);color:var(--ink)}
 .side .nv.on{background:var(--tint);color:var(--accent)}
 .side .nv .n{margin-left:auto;font-size:11px;background:var(--bad);color:#fff;border-radius:99px;padding:1px 7px}
 .side .grp{font-size:11px;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:.08em;padding:14px 12px 6px}
 .side .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:var(--g2)}
 .side .me .tx{min-width:0}
 .side .me b{font-size:14px;display:block}
 .side .me small{font-size:12px;color:var(--muted)}
 .bnav{display:none}
 .top{padding:18px 28px 12px}
 .top h1{font-size:26px}
 .view{padding:8px 28px 48px}
 .mob-srch{display:none}
 .hide-m{display:flex}
 .hide-d{display:none!important}
 .srch.hide-m{width:300px}
 .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
 .row2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
 .row2.eq{grid-template-columns:repeat(2,minmax(0,1fr))}
 .plans{grid-template-columns:repeat(3,minmax(0,1fr))}
 .prz{grid-template-columns:repeat(4,minmax(0,1fr))}
 .filters{margin:0;padding:2px 0 10px;flex-wrap:wrap}
 .thead{display:grid;padding:10px 14px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line);gap:12px}
 .tb .it{display:grid;gap:12px}
 .tb .it .cols{display:contents}
 .tb .it .cols>div{font-size:13.5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .tb .it .end{display:none}
 .tb .it .who{display:flex;align-items:center;gap:12px;min-width:0}
 .sheet{left:auto;top:0;bottom:0;width:460px;max-height:none;border-radius:26px 0 0 26px;transform:translateX(105%);padding:22px 24px}
 .sheet .grab{display:none}
 .sheet.menu{display:none}
 .toast{bottom:28px}
}
.tb .it .who{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.livedot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--okc);box-shadow:0 0 0 0 color-mix(in srgb,var(--okc) 60%,transparent);animation:lvp 1.8s infinite;flex:none}
.livedot.off{background:var(--muted2);animation:none}
@keyframes lvp{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--okc) 55%,transparent)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.livedot{animation:none}}
.lvlinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.lvlinks a{text-decoration:none}
.lvev{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.lvev:first-child{border-top:0}
.lvev small{color:var(--muted);white-space:nowrap;margin-left:auto}
</style>
</head>
<body>
<div class="app" id="app" data-tema="verde" data-escuro="0">
 <aside class="side" id="side"></aside>
 <div class="main">
  <header class="top">
   <div class="tt"><div class="kick" id="kick">Contabills · Gestão</div><h1 id="ttl">Visão geral</h1></div>
   <label class="srch hide-m"><svg class="ico s" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Buscar escritório, empresa, pessoa"></label>
   <button class="rb" data-act="tema" title="Tema" aria-label="Tema"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button>
   <button class="rb" data-go="suporte" title="Suporte" aria-label="Notificações"><svg class="ico" viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span class="pip"></span></button>
  </header>
  <main class="view" id="view"></main>
 </div>
 <nav class="bnav" id="bnav"></nav>
 <div class="scrim" id="scrim" data-act="fechar"></div>
 <div class="sheet" id="sheet"></div>
 <div class="toast" id="toast"></div>
</div>
<script>
(function(){
'use strict';
/* ---------- ícones ---------- */

const chip=(m,k)=>{const x=m[k]||['mu',k];return '<span class="chip '+x[0]+'"><i></i>'+x[1]+'</span>'};
const ultTxt=h=>h<1?'agora':h<24?'há '+h+' h':'há '+Math.floor(h/24)+' d';
const match=(...s)=>!S.q||s.join(' ').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').includes(S.q);
const escStats=e=>{const em=EMP.filter(m=>m.esc===e.id);return{emp:em.length,cont:CONT.filter(c=>c.esc===e.id).length,usu:USR.filter(u=>u.esc===e.id).length,arm:em.reduce((a,m)=>a+m.arm,0),docs:em.reduce((a,m)=>a+m.docs,0),notas:em.reduce((a,m)=>a+m.notas,0)}};
const mrr=()=>ESC.filter(e=>e.st!=='suspenso'&&e.st!=='teste').reduce((a,e)=>a+planoDe(e.plano).preco,0);

function filt(key,opts){const cur=S.f[key]||opts[0][0];return '<div class="filters">'+opts.map(o=>'<button class="fb'+(o[0]===cur?' on':'')+'" data-f="'+key+'" data-fv="'+o[0]+'">'+o[1]+'</button>').join('')+'</div>'}
const fv=(k,d)=>S.f[k]||d;
function tb(cols,head,rows){return '<div class="list tb">'+'<div class="thead" style="grid-template-columns:'+cols+'">'+head.map(h=>'<div>'+h+'</div>').join('')+'</div>'+(rows.length?rows.map(r=>r.replace('class="it"','class="it" style="grid-template-columns:'+cols+'"')).join(''):'<div class="empty">Nada encontrado com esse filtro.</div>')+'</div>'}

}

/* ---------- clique central ---------- */
document.addEventListener('click',ev=>{
 const el=ev.target.closest('[data-go],[data-act],[data-f],[data-esc],[data-emp],[data-usr],[data-tk],[data-sw],[data-tema]');if(!el)return;
 const d=el.dataset;
 if(d.go){go(d.go);return}
 if(d.f){S.f[d.f]=d.fv;render();return}
 if(d.sw){CFG[d.sw]=!CFG[d.sw];el.classList.toggle('on',CFG[d.sw]);toast(CFG[d.sw]?'Ativado':'Desativado');return}
 if(d.tema&&el.classList.contains('swt')){S.tema=d.tema;salvaTema();render();return}
 const a=d.act;
 if(a){
  const id=d.id;
  switch(a){
   case 'fechar':fecha();break;
   case 'tema':S.escuro=S.escuro?0:1;salvaTema();if(S.v==='config')render();toast(S.escuro?'Modo escuro':'Modo claro');break;
   case 'escuro':S.escuro=S.escuro?0:1;salvaTema();render();break;
   case 'mais-menu':menuMais();break;
   case 'mais':S.lim=(S.lim||40)+40;render();break;
   case 'novoEsc':formEsc();break;
   case 'novaEmp':formEmp();break;
   case 'convidar':formConvite({esc:id,emp:d.emp});break;
   case 'swLocal':el.classList.toggle('on');break;
   case 'suspEsc':escDe(id).st='suspenso';EMP.filter(m=>m.esc===id).forEach(m=>{m.st='suspensa';m.prz='—'});USR.filter(u=>u.esc===id).forEach(u=>u.st='suspenso');log('Escritório','suspendeu o escritório '+escDe(id).nome);toast('Escritório suspenso');render();detEsc(id);break;
   case 'reativarEsc':escDe(id).st='ativo';EMP.filter(m=>m.esc===id).forEach(m=>{m.st='ativa';m.prz='emdia'});USR.filter(u=>u.esc===id).forEach(u=>u.st='ativo');log('Escritório','reativou o escritório '+escDe(id).nome);toast('Escritório reativado');render();detEsc(id);break;
   case 'suspEmp':{const m=empDe(id);m.st='suspensa';m.prz='—';log('Escritório','suspendeu a empresa '+m.nome);toast('Empresa suspensa');render();detEmp(id);break}
   case 'reativarEmp':{const m=empDe(id);if(escDe(m.esc).st==='suspenso'){toast('Reative o escritório primeiro');break}m.st='ativa';m.prz='emdia';toast('Empresa reativada');render();detEmp(id);break}
   case 'suspUsr':USR.find(u=>u.id===id).st='suspenso';log('Usuário','suspendeu um login');toast('Login suspenso');render();detUsr(id);break;
   case 'reativarUsr':USR.find(u=>u.id===id).st='ativo';toast('Login reativado');render();detUsr(id);break;
   case 'reenviar':toast('E-mail enviado');break;
   case 'sessoes':log('Segurança','encerrou as sessões de um login');toast('Sessões encerradas em todos os aparelhos');break;
   case 'filtraEmp':S.f.empEsc=id;S.f.emp='todas';go('empresas');break;
   case 'exportar':toast('CSV gerado com '+AUD.length+' eventos');break;
   case 'editPlano':toast('Edição de planos chega na próxima versão');break;
   case 'responder':{const t=TK.find(x=>x.id===id),tx=$('tkResp').value.trim();if(!tx){toast('Escreva a resposta');break}t.msgs.push(['out',tx,'agora']);if(t.st==='aberto')t.st='andamento';toast('Resposta enviada');render();detTk(id);break}
   case 'resolver':TK.find(x=>x.id===id).st='resolvido';toast('Chamado resolvido');fecha();render();break;
   case 'enviaConvite':{const nm=$('cvNome').value.trim(),em=$('cvMail').value.trim(),tp=$('cvTipo').value;
    if(!nm||!/^\S+@\S+\.\S+$/.test(em)){toast('Preencha nome e e-mail válidos');break}
    const u={id:'u'+(ui++),nome:nm,email:em,tipo:tp,papel:$('cvPapel').value,ult:0,mfa:false,st:'convidado'};
    if(tp==='cliente'){const m=empDe($('cvEmp').value);u.esc=m.esc;u.emps=[m.id]}else{u.esc=$('cvEsc').value;u.emps=[]}
    USR.unshift(u);log('Usuário','convidou '+nm);fecha();toast('Convite enviado para '+em);render();break}
   case 'criaEsc':{const nm=$('neNome').value.trim();if(!nm){toast('Informe o nome do escritório');break}
    const id2='e'+(ESC.length+1+Math.floor(rnd()*1000));const resp=$('neResp').value.trim()||'Responsável';
    ESC.push({id:id2,nome:nm,cidade:$('neCid').value.trim()||'—',plano:$('nePlano').value,st:'teste',desde:'out/2026',resp});
    CONT.push({id:'c'+id2,nome:resp,esc:id2,adm:1});USR.unshift({id:'u'+(ui++),nome:resp,email:'convite pendente',tipo:'contador',papel:'Admin do escritório',esc:id2,emps:[],ult:0,mfa:false,st:'convidado'});
    log('Escritório','criou o escritório '+nm);fecha();S.f.esc='todos';go('escritorios');toast('Escritório criado em teste');break}
   case 'criaEmp':{const nm=$('nmNome').value.trim();if(!nm){toast('Informe a razão social');break}
    EMP.unshift({id:'m'+(++ei),nome:nm,cnpj:$('nmCnpj').value.trim()||'—',esc:$('nmEsc').value,cont:$('nmCont').value,st:'ativa',prz:'pend',docs:0,notas:0,arm:0,func:0,ult:0});
    fecha();S.f.emp='todas';S.f.empEsc='todos';go('empresas');toast('Empresa criada');break}
  }
  return;
 }
 if(d.esc){detEsc(d.esc);return}
 if(d.emp){detEmp(d.emp);return}
 if(d.usr){detUsr(d.usr);return}
 if(d.tk){detTk(d.tk);return}
});
function log(cat,acao){AUD.unshift({quando:new Date(),quem:'Marcelo',tipo:'admin',esc:'',cat,acao,ip:'189.40.12.8',disp:'Painel'})}
document.addEventListener('change',ev=>{const el=ev.target,d=el.dataset;
 if(d.fsel){S.f[d.fsel]=el.value;render()}
 else if(d.plano){escDe(d.plano).plano=el.value;log('Plano','alterou o plano para '+planoDe(el.value).nome);toast('Plano alterado para '+planoDe(el.value).nome);render()}
 else if(d.papel){USR.find(u=>u.id===d.papel).papel=el.value;log('Usuário','alterou o papel para '+el.value);toast('Papel alterado');render()}
 else if(d.cont){empDe(d.cont).cont=el.value;toast('Carteira atualizada');render()}
 else if(d.cfg){CFG[d.cfg]=el.value;toast('Ajuste salvo')}
});
const onQ=v=>{S.q=v.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');S.lim=0;
 if(S.q&&['geral','planos','uso','config','suporte'].includes(S.v)&&S.v!=='suporte'){S.v='empresas'}
 const act=document.activeElement,isM=act&&act.classList.contains('qm');render();
 if(isM){const m=document.querySelector('.qm');if(m){m.focus();m.setSelectionRange(m.value.length,m.value.length)}}};
document.addEventListener('input',ev=>{if(ev.target.id==='q'||ev.target.classList.contains('qm'))onQ(ev.target.value)});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')fecha()});
salvaTema();render();
/* outra aba gravou: recalcula e redesenha (as folhas de detalhe abertas ficam como estão) */
addEventListener('storage',e=>{if(e.key!=='app-multi-v1')return;lvAtualiza(false);if(['geral','aovivo','escritorios','empresas','usuarios','uso'].includes(S.v)){const y=window.scrollY;render();window.scrollTo(0,y)}});
})();
</script>

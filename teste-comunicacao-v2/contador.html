<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LivTask</title></head>
<body>
<script>
/* Entrada própria de cada app: o escopo instalado (manifesto) é este endereço, então cliente e contador abrem em janelas separadas. Carrega o mesmo app.html. */
(function(){
 /* a página vai por três caminhos (variável, sessão e endereço): alguns visualizadores não guardam o # do endereço nem a sessão */
 window.__PG='contador.html';try{sessionStorage.setItem('__pg','contador.html');}catch(e){}try{location.hash='__pg=contador.html';}catch(e){}
 fetch('app.html?t='+Date.now()).then(function(r){return r.text();}).then(function(t){
  /* o app.html traz o manifesto do cliente (LivTask): aqui o app instalado vira o do contador */
  t=t.replace('<link rel="manifest" href="manifest.webmanifest">','<link rel="manifest" href="manifest-contador.webmanifest">');
  document.open();document.write(t);document.close();}).catch(function(){document.body.textContent='Não foi possível abrir o app. Volte à página inicial e tente de novo.';});
})();
</script>
</body></html>

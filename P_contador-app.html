/* cor sólida (Tema do app): sem degradê no fundo, nos destaques e nos botões */
.phone[data-solido="1"][data-solido]{--a1:var(--a2);--a3:var(--a2);--g1:var(--g2);--ground:var(--g2)}
.tmodo{display:flex;align-self:center;gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.16)}.tmodo button{min-width:96px;height:34px;padding:0 14px;border-radius:10px;font-size:13px;font-weight:700;color:#fff}.tmodo button[aria-checked="true"]{background:#fff;color:#17181B;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.t.fo{height:112px;gap:2px;justify-content:flex-start}
.t.fo .ib{margin-bottom:auto}
.t.fo .tl{font-size:14px;margin-top:10px}
.tc{font-size:12px;color:var(--muted)}
.ib{width:36px;height:36px;border-radius:12px;background:var(--tint);color:var(--accent);display:flex;align-items:center;justify-content:center}
.g3 .ib{width:34px;height:34px;border-radius:11px}
.list{display:flex;flex-direction:column}
.ar{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ar:last-child{border-bottom:0}
.d{width:8px;height:8px;border-radius:4px;background:var(--dot);flex:none}.d.on{background:var(--accent)}
.rcv{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:linear-gradient(135deg,var(--a1),var(--a2) 60%,var(--a3));color:var(--onA);box-shadow:0 10px 22px var(--glow);width:100%}
.rcv .ri{background:rgba(255,255,255,.18);color:var(--onA)}
.rcv .rt .b{color:var(--onA);opacity:.8}
.dl{width:36px;height:36px;border-radius:18px;background:var(--btn);color:var(--btnInk);display:flex;align-items:center;justify-content:center;flex:none}
.dl.sm{width:32px;height:32px;background:var(--tint);color:var(--accent)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:-6px}
.sg{flex:1;height:36px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--muted);text-align:center}
.sg.on{background:var(--tint);color:var(--accent);font-weight:700}
.glist{display:flex;flex-direction:column;gap:10px}
.gu{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.gt{display:flex;align-items:center;gap:12px}
.gv{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.gs{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ga{display:flex;gap:6px}
.mini{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:15px;background:var(--tint);color:var(--accent);font-size:12px;font-weight:700}
.foot{margin:0;text-align:center;font-size:11.5px;color:var(--muted2)}
.ask{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:18px;background:var(--card);border:1px solid var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.srch{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.srch input{flex:1;border:0;background:none;outline:none;font:500 14px 'Manrope',system-ui,sans-serif;color:var(--ink);min-width:0}
.srch input::placeholder{color:var(--muted2)}
.srch:focus-within{border-color:var(--accent)}
.chips{display:flex;gap:8px;margin:-6px 0 -4px;flex-wrap:wrap}
.chip{height:32px;padding:0 14px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--a2);border-color:var(--a2);color:var(--onA)}
.empty{margin:0;padding:18px 0;text-align:center;font-size:13px;color:var(--muted)}

/* fluxos */
.phone.flow nav.tab{display:none}
.phone.flow .fabov,.phone.flow .fabmenu{display:none}
.stp{display:flex;flex-direction:column;gap:10px;margin-top:-4px}
.sl{display:flex;flex-direction:column;gap:2px}
.sl span{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.sl b{font-size:18px;font-weight:700;letter-spacing:-.01em}
.sb{display:flex;gap:6px}
.sb i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.sb i.on{background:linear-gradient(90deg,var(--a1),var(--a2))}
.form{display:flex;flex-direction:column;gap:16px}
.fld{display:flex;flex-direction:column;gap:7px}
.fl{font-size:13px;font-weight:700}
.fl i{font-style:normal;font-weight:500;color:var(--muted)}
.fh{font-size:12px;color:var(--muted)}
#ng-ler{display:block;padding:10px 12px;border-radius:12px;background:var(--tint);color:var(--ink);font-weight:600}#ng-ler.warn{background:var(--warnBg);color:var(--warn)}
.fe{font-size:12px;font-weight:600;color:#C2410C}
.phone[data-escuro="1"] .fe{color:#FB923C}
.fld input,.fld textarea,.sel select{width:100%;height:48px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:500 15px 'Manrope',system-ui,sans-serif;outline:none;-webkit-appearance:none;appearance:none}
.fld textarea{height:auto;min-height:88px;padding:12px 14px;resize:vertical;line-height:1.4}
.fld input:focus,.fld textarea:focus,.sel select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--tint)}
.fld input::placeholder,.fld textarea::placeholder{color:var(--muted2)}
.fld input[type=date]{color-scheme:inherit}
.sel{position:relative}
.sel select{padding-right:40px;cursor:pointer}
.sel svg{position:absolute;right:14px;top:15px;color:var(--muted);pointer-events:none}
.mon{position:relative}.mon span{position:absolute;left:14px;top:14px;font-weight:700;color:var(--muted)}.mon input{padding-left:44px;font-variant-numeric:tabular-nums}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.op{height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:600;color:var(--ink)}
.op.on{background:var(--a2);border-color:var(--a2);color:var(--onA)}
.up{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1.5px dashed var(--line);background:var(--card);cursor:pointer}
.up:hover{border-color:var(--accent)}
.up.has{border-style:solid;border-color:var(--accent)}
.up .a{word-break:break-word}
.fi-hide{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.fi-over{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:2;font-size:100px;margin:0;padding:0;border:0}label.up{position:relative;overflow:hidden}
.note{padding:12px 14px;border-radius:14px;background:var(--tint);font-size:13px;line-height:1.45;color:var(--ink)}
.note.calc b{font-variant-numeric:tabular-nums}
.vg{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.vh,.vr{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:6px;align-items:center;padding:8px 10px}
.vh{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.02em;line-height:1.2;background:var(--tint)}
.vr{border-top:1px solid var(--line)}
.vn{font-size:12.5px;font-weight:600;line-height:1.2}
.vr input{height:36px;padding:0 8px;border-radius:10px;font-size:13.5px;text-align:center}
.rev{display:flex;flex-direction:column;gap:12px}
.rs{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.rsh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
.rsh b{font-size:14px}
.rv{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.rv:first-of-type{border-top:0}
.rv span:first-child{color:var(--muted);flex:none;max-width:45%}
.rv span:last-child{text-align:right;font-weight:600;word-break:break-word}
.fbar{position:sticky;bottom:-26px;margin:auto -22px -26px;padding:14px 22px 26px;background:linear-gradient(180deg,transparent,var(--ground) 30%);display:flex;flex-direction:column;gap:8px;z-index:5}
.cta{width:100%;height:50px;border-radius:25px;background:linear-gradient(135deg,var(--a1),var(--a2) 60%,var(--a3));color:var(--onA);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 18px var(--glow);text-align:center}
.cta.ghost{background:var(--card);color:var(--accent);border:1px solid var(--line);box-shadow:none}
.okv{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:40px 10px 10px}
.okc{width:84px;height:84px;border-radius:42px;background:linear-gradient(135deg,var(--a1),var(--a3));color:var(--onA);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 28px var(--glow);animation:popc .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes popc{from{transform:scale(.4);opacity:0}}
.okv h2{margin:8px 0 0;font-size:22px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.okv p{margin:0;font-size:14px;line-height:1.5;color:var(--muted);max-width:30ch}
.prot{margin-top:6px;font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:10px;background:var(--tint);color:var(--accent);font-variant-numeric:tabular-nums}
.card.pad{padding:14px 16px}
.pt{display:flex;align-items:center;gap:12px}
.tline{list-style:none;margin:0;padding:4px 16px;background:var(--card);border:1px solid var(--line);border-radius:18px}
.tline li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;position:relative}
.tline li:not(:last-child)::after{content:"";position:absolute;left:11px;top:36px;bottom:-4px;width:2px;background:var(--line)}
.tline li.ok:not(:last-child)::after{background:var(--accent)}
.tb{width:24px;height:24px;border-radius:12px;border:2px solid var(--line);background:var(--card);flex:none;display:flex;align-items:center;justify-content:center;color:var(--onA);position:relative;z-index:1}
.tline li.ok .tb{background:var(--accent);border-color:var(--accent)}
.tline li.cur .tb{border-color:var(--accent);box-shadow:0 0 0 4px var(--tint)}
.tline li:not(.ok):not(.cur) .a{color:var(--muted)}
.tline .tb svg{width:13px;height:13px}
.lead{margin:-8px 0 0;font-size:13px;color:var(--muted)}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.t.sm4{height:auto;min-height:0;flex-direction:row;align-items:center;justify-content:flex-start;gap:10px;padding:12px;border-radius:16px}
.t.sm4 .tl{font-size:13.5px}
.g2b{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:-6px}
.wb{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--accent);text-align:center}
.askok{display:none;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--okc);flex:none}
.ask.feito{border-color:var(--line);box-shadow:none}
.ask.feito .send{display:none}.ask.feito .askok{display:inline-flex}
.ci .cb{display:flex;align-items:center;justify-content:center;color:transparent}
.ci.feito .cb{background:var(--onA);border-color:var(--onA);color:var(--a2)}
.ci.feito .cl{text-decoration:line-through;opacity:.7}
.ix{height:34px;padding:0 10px;border-radius:10px;font-size:12.5px}
.rst{margin-top:14px;font-size:12px;font-weight:600;color:var(--sub);text-decoration:underline;text-underline-offset:3px;padding:4px 0}
.ixg{display:flex;flex-direction:column;gap:4px}
.ixg h3{margin:10px 0 2px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sub)}

/* chat */
.phone.chat .scr#s-dyn{padding-bottom:0;gap:14px}
.chd{position:sticky;top:-30px;margin:-30px -22px 0;padding:22px 22px 12px;background:var(--card);border-bottom:1px solid var(--line);z-index:4}
.cav{width:40px;height:40px;border-radius:20px;background:linear-gradient(135deg,var(--a1),var(--a3));color:var(--onA);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.cav.lg{width:46px;height:46px;border-radius:23px}
h1.h1s{font-size:16px;margin:0}
.chd .s{display:flex;align-items:center;gap:6px;font-size:11.5px}
.on-dot{width:7px;height:7px;border-radius:4px;background:#2FB67C;display:inline-block}
.msgs{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.msg{display:flex;flex-direction:column;align-items:flex-start;gap:3px;max-width:84%}
.msg.me{align-self:flex-end;align-items:flex-end}
.bb{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:10px 14px;font-size:14px;line-height:1.4;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.msg.me .bb{background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--onA);border:0;border-radius:18px 18px 6px 18px}
.bl{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--accent);background:var(--tint);padding:6px 10px;border-radius:12px}
.mh{font-size:10.5px;color:var(--muted2);padding:0 6px}
.typing .bb{flex-direction:row;gap:4px;padding:14px}
.typing i{width:6px;height:6px;border-radius:3px;background:var(--muted2);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:.25}}
.quick{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:auto -22px 0;padding:0 22px}
.quick::-webkit-scrollbar{display:none}
.qk{flex:none;height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:600;color:var(--accent);white-space:nowrap}
.cbar{position:sticky;bottom:0;margin:0 -22px;padding:10px 14px 24px;background:var(--card);border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;z-index:4}
.cbar input{flex:1;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--ground);padding:0 16px;font:500 14px 'Manrope',system-ui,sans-serif;color:var(--ink);outline:none;min-width:0}
.cbar input:focus{border-color:var(--accent)}
.ca{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.cs{width:44px;height:44px;border-radius:22px;background:linear-gradient(135deg,var(--a1),var(--a3));color:var(--onA);display:flex;align-items:center;justify-content:center;flex:none}
/* notificações, perfil */
.lnk.right{align-self:flex-end;margin:-10px 0 -8px}
.nt.un .a{font-weight:700}
.ud{width:9px;height:9px;border-radius:5px;background:var(--accent);flex:none}
.phd{display:flex;align-items:center;gap:14px;padding-top:6px}
.pav{width:60px;height:60px;border-radius:30px;background:linear-gradient(135deg,var(--a1),var(--a3));color:var(--onA);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;flex:none;box-shadow:0 8px 18px var(--glow)}
.tgl .sw2{background:var(--line)}
.tgl[aria-checked="true"] .sw2{background:var(--a2)}
.tgl[aria-checked="true"] .sw2::after{transform:translateX(18px)}
.cta.danger{color:#C2410C}
.phone[data-escuro="1"] .cta.danger{color:#FB923C}
.conf{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.conf p{margin:0;font-weight:600;font-size:14px;text-align:center}
.conf .g2b{margin:0}
.wb.red{background:#C2410C;border-color:#C2410C;color:#fff}
.av2{width:36px;height:36px;border-radius:18px;background:var(--tint);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex:none}
.card .rv:first-child{border-top:0}
.sel-t{user-select:all}
.faq{display:flex;flex-direction:column;gap:8px}
.faq details{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 16px}
.faq summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;font-size:14px;font-weight:600}
.faq summary::-webkit-details-marker{display:none}
.faq summary svg{flex:none;color:var(--muted);transition:transform .2s}
.faq details[open] summary svg{transform:rotate(180deg)}
.faq p{margin:0 0 10px;font-size:13.5px;line-height:1.5;color:var(--muted)}
.faq .mini{margin-bottom:14px}
.rot .cbx{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;color:var(--onA)}
.rot.feito .cbx{background:var(--accent);border-color:var(--accent)}
.rot.feito .a{color:var(--muted);text-decoration:line-through}
.rot .cbx svg{width:13px;height:13px}
.ar.pad2{padding:12px 0}
.gt{width:100%}
.bar{height:54px;border-radius:6px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px,var(--ink) 8px 11px,transparent 11px 12px);opacity:.85}
.code{margin:10px 0 12px;font-size:12.5px;font-weight:600;letter-spacing:.02em;text-align:center;font-variant-numeric:tabular-nums;user-select:all;word-break:break-word}
.lg-wrap{display:flex;flex-direction:column;gap:14px;padding-top:40px}
.logo-b{width:56px;height:56px;border-radius:17px;background:linear-gradient(135deg,var(--a1),var(--a3));color:var(--onA);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;box-shadow:0 10px 24px var(--glow)}
.lead2{margin:-6px 0 10px;font-size:14px;line-height:1.5;color:var(--muted)}
.lg-wrap .lnk{align-self:flex-start;margin-top:-6px}
/* tela cheia no celular */
@media (max-width:520px){
 body{padding:0!important;overflow:hidden}
 .stage{display:block}
 .index{display:none}
 .phone{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none;zoom:1!important}
 .scr{padding-top:calc(12px + env(safe-area-inset-top, 0px));padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px))}
 :root{padding-top:0;padding-bottom:0}
 .phone nav.tab{height:calc(66px + env(safe-area-inset-bottom, 0px) + var(--navpad, 0px));padding-bottom:calc(8px + env(safe-area-inset-bottom, 0px) + var(--navpad, 0px))}
 .phone .n{font-size:10.5px;letter-spacing:-.01em;min-width:0;white-space:nowrap}
 .phone .fw{width:72px}
 .chd{top:calc(-30px - env(safe-area-inset-top, 0px));margin-top:calc(-30px - env(safe-area-inset-top, 0px));padding-top:calc(22px + env(safe-area-inset-top, 0px))}
 .cbar{padding-bottom:calc(14px + env(safe-area-inset-bottom, 0px) + var(--navpad, 0px))}
 .fbar{padding-bottom:calc(26px + env(safe-area-inset-bottom, 0px) + var(--navpad, 0px))}
 .modal{top:calc(92px + env(safe-area-inset-top, 0px))}
}

/* empresas */
.empsw{display:inline-flex;align-items:center;gap:7px;max-width:100%;padding:3px 8px 3px 3px;margin:0 0 4px -3px;border-radius:14px;font-size:12.5px;font-weight:600;color:var(--muted)}
.empsw:hover{background:var(--tint)}
.empsw .empn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.empsw{align-self:flex-start;max-width:calc(100% + 3px)}
.esw{width:36px;height:36px;border-radius:12px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none;text-shadow:0 1px 3px rgba(0,0,0,.25)}
.esw.sm{width:22px;height:22px;border-radius:7px;font-size:9px}
.emr.on .a{color:var(--accent)}
.esheet{position:absolute;left:0;right:0;bottom:0;z-index:61;background:var(--ground);color:var(--ink);border-radius:26px 26px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:14px;box-shadow:0 -12px 40px rgba(0,0,0,.25);animation:up .25s cubic-bezier(.2,.8,.2,1);max-height:80%;overflow-y:auto}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.esh{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin-bottom:10px}
.esheet .ms{color:var(--muted)}
.esheet .g2b{margin:0}
